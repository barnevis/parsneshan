<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پارس‌نشان — آزمایشگاه</title>
<style>
  * { box-sizing: border-box }
  body { font-family: sans-serif; margin: 0 auto; max-width: 60rem; padding: 1rem }
  h1 { font-size: 1.25rem }
  .panes { display: flex; gap: 1rem }
  textarea { flex: 1; min-height: 24rem; font-family: monospace; padding: .5rem; resize: vertical }
  #output { border: 1px solid #ccc; flex: 1; min-height: 24rem; padding: .5rem }
</style>
</head>
<body>
<h1>آزمایشگاه پارس‌نشان</h1>
<div class="panes">
  <textarea id="input" spellcheck="false"></textarea>
  <div id="output"></div>
</div>
<script type="module">
import {micromark} from 'micromark'
import {warning, warningHtml, caution, cautionHtml, important, importantHtml, tip, tipHtml, note, noteHtml} from '../index.js'

const extensions = [warning(), caution(), important(), tip(), note()]
const htmlExtensions = [warningHtml(), cautionHtml(), importantHtml(), tipHtml(), noteHtml()]

const input = document.getElementById('input')
const output = document.getElementById('output')

function render() {
  output.innerHTML = micromark(input.value, {extensions, htmlExtensions})
}

input.addEventListener('input', render)

input.value = [
  '# آزمایش پارس‌نشان',
  '',
  '... هشدار',
  'این یک **هشدار** است.',
  '- مورد یک',
  '- مورد دو',
  '...',
  '',
  '... احتیاط',
  'این یک احتیاط است.',
  '...',
  '',
  '... مهم',
  'این یک نکته مهم است.',
  '...',
  '',
  '... راهنما',
  'این یک راهنما است.',
  '...',
  '',
  '... نکته',
  'این یک نکته است.',
  '...'
].join('\n')

render()
</script>
</body>
</html>
